<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101817" />
    <meta name="description" content="Gehr 的旅遊規劃：依年份整理正在規劃與已完成的旅行。" />
    <title>Gehr 的旅遊規劃</title>
    <link rel="stylesheet" href="assets/home.css" />
  </head>
  <body>
    <a class="skip-link" href="#trips">跳到旅行列表</a>

    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Gehr 的旅遊規劃首頁">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span>Gehr 的旅遊規劃</span>
      </a>
      <button class="theme-toggle" type="button" aria-label="切換明暗模式" title="切換明暗模式">◐</button>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">TRAVEL INDEX</p>
          <h1 id="hero-title">把想走的路，<br />整理成走過的地方。</h1>
          <p class="hero-note">從出發前的路線、住宿與補給，到回來後的實際紀錄；每趟旅行都按年份留下一份可回看的版本。</p>
          <a class="primary-link" href="#trips">查看旅行紀錄 <span aria-hidden="true">↓</span></a>
        </div>
        <aside class="hero-index" aria-label="網站內容摘要">
          <span class="index-label">目前收錄</span>
          <strong id="trip-count">1</strong>
          <span>趟旅行</span>
          <div class="index-rule"></div>
          <p>規劃中的路線會持續調整；完成後保留實際走法與旅後回顧。</p>
        </aside>
      </section>

      <section class="trip-index" id="trips" aria-labelledby="trips-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">JOURNEYS BY YEAR</p>
            <h2 id="trips-title">依年份瀏覽</h2>
          </div>
          <p>點進行程查看地圖、分段導航、備援補給與參考資料。</p>
        </div>
        <div id="year-groups"></div>
      </section>
    </main>

    <footer class="site-footer">
      <strong>Gehr 的旅遊規劃</strong>
      <span>路線會變，走過的經驗留下來。</span>
    </footer>

    <script src="trips/2026/qiedigua/route-data.js"></script>
    <script src="assets/home.js"></script>
  </body>
</html>
