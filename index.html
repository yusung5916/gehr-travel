<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1618" />
    <meta name="description" content="切地瓜騎乘路線、分段導航與出發前檢查。" />
    <title>2026 切地瓜｜四天三夜騎乘規劃</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要內容</a>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="回到頁首">
        <span class="brand-mark" aria-hidden="true">切</span>
        <span>Qiedigua 2026</span>
      </a>
      <nav class="header-nav" aria-label="頁面導覽">
        <a href="#route">路線</a>
        <a href="#checklist">檢查</a>
        <button class="theme-toggle" type="button" aria-label="切換明暗模式" title="切換明暗模式">
          <span aria-hidden="true">◐</span>
        </button>
      </nav>
    </header>

    <main id="main">
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow" id="trip-eyebrow"></p>
          <div class="status-row">
            <span class="status-pill" id="trip-status"></span>
            <span class="updated" id="trip-updated"></span>
          </div>
          <h1 id="hero-title"></h1>
          <p class="hero-date" id="trip-date"></p>
          <p class="hero-note" id="trip-note"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#route">查看四天路線</a>
            <button class="button button-ghost" id="copy-summary" type="button">複製行程摘要</button>
          </div>
        </div>
        <div class="route-poster" aria-label="四天路線概覽">
          <div class="poster-grid" aria-hidden="true"></div>
          <div class="poster-label poster-start" id="poster-start"></div>
          <div class="poster-line">
            <span class="poster-node">富貴角</span>
            <span class="poster-node">武嶺</span>
            <span class="poster-node">塔塔加</span>
            <span class="poster-node">鵝鑾鼻</span>
            <span class="poster-node">台東</span>
            <span class="poster-node">花蓮</span>
          </div>
          <div class="poster-label poster-end" id="poster-end"></div>
          <p id="poster-caption"></p>
        </div>
      </section>

      <section class="stats" aria-label="行程重點" id="stats"></section>

      <section class="section principles" aria-labelledby="principles-title">
        <div class="section-heading">
          <p class="section-kicker">Riding brief</p>
          <h2 id="principles-title">這趟怎麼騎</h2>
        </div>
        <div class="principle-grid" id="principles-list"></div>
      </section>

      <section class="section route-section" id="route" aria-labelledby="route-title">
        <div class="section-heading route-heading">
          <div>
            <p class="section-kicker">Four days, one route</p>
            <h2 id="route-title">每日路線與導航</h2>
          </div>
          <p>導航按鈕會開啟 Google Maps 機車路線。出發前請拉遠檢查紫色路線是否留在指定道路。</p>
        </div>
        <div class="day-tabs" id="day-tabs" role="tablist" aria-label="選擇行程日"></div>
        <div id="day-panels"></div>
      </section>

      <section class="section checklist-section" id="checklist" aria-labelledby="checklist-title">
        <div class="section-heading route-heading">
          <div>
            <p class="section-kicker">Before departure</p>
            <h2 id="checklist-title">出發前檢查</h2>
          </div>
          <div class="checklist-actions">
            <span id="check-progress" aria-live="polite"></span>
            <button class="text-button" id="reset-checklist" type="button">重設勾選</button>
          </div>
        </div>
        <div class="checklist-grid" id="checklist-groups"></div>
      </section>

      <section class="section open-section" aria-labelledby="open-title">
        <div class="section-heading">
          <p class="section-kicker">Next discussion</p>
          <h2 id="open-title">下一輪要定的事</h2>
        </div>
        <ol class="open-list" id="open-questions"></ol>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <strong id="footer-title"></strong>
        <span id="footer-source"></span>
      </div>
      <a href="#top">回到頁首 ↑</a>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="route-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
